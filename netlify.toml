[build]
  publish = "."

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "https://admin.ballbrain.app/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://admin.ballbrain.app/:splat"
  status = 301
  force = true
